name: Irodov ElegantBook Chinese build
concurrency:
  group: irodov-elegantbook-main-optics-v5
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'external_sources/irodov-zh-elegant/**'
      - '.github/workflows/irodov-elegantbook.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore legacy split-fragment views for independent QA (not tracked)
        run: python3 external_sources/irodov-zh-elegant/expand_legacy_fragments.py
      - name: Validate all translated problem blocks
        run: python3 external_sources/irodov-zh-elegant/check_sources.py
      - name: Audit 1878 individual statement/solution/check segments
        run: python3 external_sources/irodov-zh-elegant/lint_problems.py
      - name: Recompute selected numerical physics answers
        run: python3 external_sources/irodov-zh-elegant/numeric_regression.py
      - name: Independently audit atomic spectra and molecular physics
        run: python3 external_sources/irodov-zh-elegant/spectra_molecules_regression.py
      - name: Independently audit Rutherford scattering and atomic spectra
        run: python3 external_sources/irodov-zh-elegant/atomic_scattering_regression.py
      - name: Independently audit de Broglie waves and quantum wells
        run: python3 external_sources/irodov-zh-elegant/wave_quantum_regression.py
      - name: Deep-check original radioactive decay and Bateman chains
        run: python3 external_sources/irodov-zh-elegant/radioactivity_deep_regression.py
      - name: Deep-check original nuclear energy/momentum and reactor physics
        run: python3 external_sources/irodov-zh-elegant/nuclear_reactions_deep_regression.py
      - name: Deep-check relativistic particles and independent conservation laws
        run: python3 external_sources/irodov-zh-elegant/particles_conservation_regression.py
      - name: Independently recheck Part I kinematics and rigid-body motion
        run: python3 external_sources/irodov-zh-elegant/mechanics_kinematics_regression.py
      - name: Independently recheck Part I Newtonian dynamics and constraints
        run: python3 external_sources/irodov-zh-elegant/mechanics_dynamics_regression.py
      - name: Independently recheck Part I work, collisions and angular momentum
        run: python3 external_sources/irodov-zh-elegant/mechanics_conservation_regression.py
      - name: Independently recheck Part I gravity and satellite orbits
        run: python3 external_sources/irodov-zh-elegant/mechanics_gravitation_regression.py
      - name: Independently recheck Part I rigid-body dynamics and gyroscopes
        run: python3 external_sources/irodov-zh-elegant/mechanics_rigidbody_regression.py
      - name: Independently recheck Part I elastic deformation and strength
        run: python3 external_sources/irodov-zh-elegant/mechanics_elasticity_regression.py
      - name: Independently recheck Part I hydrodynamics and viscosity
        run: python3 external_sources/irodov-zh-elegant/mechanics_fluids_regression.py
      - name: Independently recheck Part I special relativity and four-momentum
        run: python3 external_sources/irodov-zh-elegant/mechanics_relativity_regression.py
      - name: Independently recheck Part II ideal and nonideal gas states
        run: python3 external_sources/irodov-zh-elegant/thermo_state_regression.py
      - name: Independently recheck Part II first law and thermodynamic paths
        run: python3 external_sources/irodov-zh-elegant/thermo_firstlaw_regression.py
      - name: Independently recheck Part II molecular kinetic theory and Maxwell distribution
        run: python3 external_sources/irodov-zh-elegant/thermo_kinetic_regression.py
      - name: Independently recheck Part II Carnot cycles and entropy statistics
        run: python3 external_sources/irodov-zh-elegant/thermo_entropy_regression.py
      - name: Independently recheck Part II capillarity and interface thermodynamics
        run: python3 external_sources/irodov-zh-elegant/thermo_capillarity_regression.py
      - name: Independently recheck Part II phase equilibria and latent heats
        run: python3 external_sources/irodov-zh-elegant/thermo_phase_regression.py
      - name: Independently recheck Part II molecular transport and heat conduction
        run: python3 external_sources/irodov-zh-elegant/thermo_transport_regression.py
      - name: Independently recheck Part III electrostatics and Gauss-Poisson laws
        run: python3 external_sources/irodov-zh-elegant/electrostatics_vacuum_regression.py
      - name: Independently recheck Part III conductors and dielectric polarization
        run: python3 external_sources/irodov-zh-elegant/electro_conductors_regression.py
      - name: Independently recheck Part III capacitor networks and electrostatic work
        run: python3 external_sources/irodov-zh-elegant/electro_capacitance_regression.py
      - name: Independently recheck Part III resistor circuits and electric transport
        run: python3 external_sources/irodov-zh-elegant/electro_current_regression.py
      - name: Independently recheck Part III magnetostatics and magnetic media
        run: python3 external_sources/irodov-zh-elegant/electro_magnetostatics_regression.py
      - name: Independently recheck Part III Faraday induction and Maxwell equations
        run: python3 external_sources/irodov-zh-elegant/electro_induction_regression.py
      - name: Independently recheck Part III charged-particle cyclotron and betatron
        run: python3 external_sources/irodov-zh-elegant/electro_charged_regression.py
      - name: Independently recheck Part IV initial mechanical oscillations
        run: python3 external_sources/irodov-zh-elegant/oscillations_mechanical_regression.py
      - name: Independently audit Irodov Part IV.51-93 mechanical oscillations and damped resonance
        run: python3 external_sources/irodov-zh-elegant/oscillations_mechanical_051_093_regression.py
      - name: Independently audit Irodov Part IV.94-149 electrical oscillations and RLC circuits
        run: python3 external_sources/irodov-zh-elegant/oscillations_electric_094_149_regression.py
      - name: Independently audit Irodov Part IV.150-188 acoustic wave and Doppler regressions
        run: python3 external_sources/irodov-zh-elegant/waves_elastic_150_188_regression.py
      - name: Independently audit Irodov Part IV.189-224 Maxwell waves and radiation regressions
        run: python3 external_sources/irodov-zh-elegant/waves_electromagnetic_189_224_regression.py
      - name: Independently audit Part V.1-63 photometric and paraxial geometrical optics
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/optics_geometrical_001_063_regression.py
      - name: Independently audit Part V.64-96 wave interference and thin films
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/optics_interference_064_096_regression.py
      - name: Independently audit Part V.97-156 Fresnel diffraction and spectrometers
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/optics_diffraction_097_156_regression.py
      - name: Independently audit Part V.157-199 polarization and optical activity
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/optics_polarization_157_199_regression.py
      - name: Independently audit Part V.200-245 optical dispersion and relativistic Doppler
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/optics_dispersion_moving_200_245_regression.py
      - name: Independently audit Part V.246-292 thermal radiation and photon scattering
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/optics_thermal_quantum_246_292_regression.py
      - name: Deep-audit original VI.1-48 Coulomb scattering and Bohr spectroscopy
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/atomic_scattering_source_001_048_regression.py
      - name: Deep-audit original VI.49-96 quantum wavefunctions and WKB
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/atomic_wave_quantum_source_049_096_regression.py
      - name: Deep-audit original VI.97-166 angular momenta and atomic multiplets
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/atomic_spectra_source_097_166_regression.py
      - name: Deep-audit original VI.167-213 molecular and crystal statistics
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/atomic_molecules_source_167_213_regression.py
      - name: Deep-audit original VI.214-310 nuclear and particle conservation
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/atomic_nuclear_source_214_310_regression.py
      - name: Cross-edition audit physical positivity, grating units and Wien Jacobians
        if: ${{ success() || failure() }}
        run: python3 external_sources/irodov-zh-elegant/cross_edition_physics_regression.py
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: external_sources/irodov-zh-elegant
          root_file: |
            cover.tex
            main.tex
          texlive_version: '2026'
          args: -xelatex -file-line-error -halt-on-error -interaction=nonstopmode
      - uses: actions/upload-artifact@v4
        with:
          name: irodov-zh-elegantbook-pdf
          path: |
            external_sources/irodov-zh-elegant/main.pdf
            external_sources/irodov-zh-elegant/cover.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Commit successfully compiled PDFs to the repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root=external_sources/irodov-zh-elegant
          cp "$root/main.pdf" "$RUNNER_TEMP/irodov-main-compiled.pdf"
          cp "$root/cover.pdf" "$RUNNER_TEMP/irodov-cover-compiled.pdf"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # An older compilation must never replace a newer translated book.
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- \
              "$root/main.tex" "$root/cover.tex" "$root/chapters"; then
              echo "Newer TeX sources exist: skipping stale PDF publication; queued build will publish."
              exit 0
            fi
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/irodov-main-compiled.pdf" "$root/main.pdf"
            cp "$RUNNER_TEMP/irodov-cover-compiled.pdf" "$root/cover.pdf"
            git add -f "$root/main.pdf" "$root/cover.pdf"
            if git diff --cached --quiet; then
              echo "Compiled PDFs are already current."
              exit 0
            fi
            git commit -m "docs: publish Irodov Chinese ElegantBook PDFs [skip ci]"
            if git push origin HEAD:main; then
              echo "Published compiled PDFs on latest main."
              exit 0
            fi
            echo "Concurrent GitHub update on attempt $attempt; retrying without binary rebase."
          done
          echo "Failed to publish PDFs after five optimistic retries." >&2
          exit 1
