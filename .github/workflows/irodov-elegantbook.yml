name: Irodov ElegantBook Chinese build
concurrency:
  group: irodov-elegantbook-main
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'external_sources/irodov-zh-elegant/**'
      - '.github/workflows/irodov-elegantbook.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all translated problem blocks
        run: python3 external_sources/irodov-zh-elegant/check_sources.py
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: external_sources/irodov-zh-elegant
          root_file: |
            cover.tex
            main.tex
          texlive_version: '2026'
          args: -xelatex -file-line-error -halt-on-error -interaction=nonstopmode
      - uses: actions/upload-artifact@v4
        with:
          name: irodov-zh-elegantbook-pdf
          path: |
            external_sources/irodov-zh-elegant/main.pdf
            external_sources/irodov-zh-elegant/cover.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Commit successfully compiled PDFs to the repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f external_sources/irodov-zh-elegant/main.pdf external_sources/irodov-zh-elegant/cover.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish Irodov Chinese ElegantBook PDFs [skip ci]"
            if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          fi
