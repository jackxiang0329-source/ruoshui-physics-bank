name: Physics second-round lossless compaction

on:
  push:
    branches: [chore/physics-small-corpus-20261122]
    paths:
      - scripts/compact_small_external_sources.py
      - .github/workflows/compact-small-external-sources.yml

permissions:
  contents: write

concurrency:
  group: physics-small-corpus-compaction
  cancel-in-progress: false

jobs:
  pack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Gate exact source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files 'external_sources/ubc_opbp/raw/*.md' | wc -l)" -eq 265
          test "$(git ls-files 'external_sources/intro_physics/raw/*.md' | wc -l)" -eq 53
          echo "bank_sha_before=$(git rev-parse HEAD:bank)" >> "$GITHUB_ENV"
          echo "irodov_sha_before=$(git rev-parse HEAD:external_sources/irodov-zh-elegant)" >> "$GITHUB_ENV"
      - name: Pack 318 exact raw files with independent before-delete SHA checks
        run: python3 scripts/compact_small_external_sources.py --apply
      - name: Verify both small and all three legacy archives
        run: |
          python3 scripts/compact_small_external_sources.py --verify
          python3 scripts/compact_external_candidates.py --verify
      - name: Verify formal bank and Irodov source are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build.py --check
          test "$(git rev-parse HEAD:bank)" = "$bank_sha_before"
          test "$(git rev-parse HEAD:external_sources/irodov-zh-elegant)" = "$irodov_sha_before"
          test -z "$(git status --porcelain -- bank/ tex/ data/ external_sources/irodov-zh-elegant/)"
      - name: Commit exclusively verified new archives and raw removals
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- external_sources/ubc_opbp external_sources/intro_physics external_sources/_bundles
          deleted="$(git diff --cached --name-only --diff-filter=D | wc -l)"
          added="$(git diff --cached --name-only --diff-filter=A | wc -l)"
          test "$deleted" -eq 318
          test "$added" -eq 3
          if git diff --cached --name-only | grep -vE '^external_sources/(ubc_opbp/raw/|intro_physics/raw/|_bundles/(ubc_opbp-raw.tar.gz|intro_physics-raw.tar.gz|small_sources_manifest.json)$)'; then
            echo "Unexpected change, refusing to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(physics): bundle 318 more unreviewed Markdown files without loss"
          git push origin HEAD:chore/physics-small-corpus-20261122
          echo "### Second-round candidate archiving" >> "$GITHUB_STEP_SUMMARY"
          echo "318 unreviewed Markdown originals replaced by 2 tar.gz bundles and 1 checksum manifest." >> "$GITHUB_STEP_SUMMARY"
          echo "The formal problem bank, Irodov project, and WeBWorK PG files remain untouched." >> "$GITHUB_STEP_SUMMARY"
