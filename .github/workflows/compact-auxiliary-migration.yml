name: Compact auxiliary resources migration
on:
  push:
    branches: [compact-auxiliary-archives]
    paths:
      - scripts/compact_auxiliary.py
      - .github/workflows/compact-auxiliary-migration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/compact-auxiliary-archives'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pack and compare all 135 Git blobs; remove legacy tracking
        run: |
          python3 scripts/compact_auxiliary.py --migrate
          python3 scripts/compact_auxiliary.py --verify
      - name: Restore canonical bank and verify project
        run: |
          python3 scripts/compact_bank.py --restore
          python3 scripts/check_repository_layout.py
          python3 scripts/build.py --check
          python3 -m compileall -q scripts tests external_sources/irodov-zh-elegant
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from scripts.compact_auxiliary import GROUPS, load
          root=Path('.')
          tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          restored={name:raw for group in GROUPS for name,raw in load(root,group).items()}
          assert len(restored)==135 and not tracked.intersection(restored)
          assert all((root/name).read_bytes()==raw for name,raw in restored.items())
          print('135 byte-identical restored files; none tracked')
          PY
      - name: Commit verified migration only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: pack 135 auxiliary files into three verified ZIP archives'
          git push origin HEAD:compact-auxiliary-archives
