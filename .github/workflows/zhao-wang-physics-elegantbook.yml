name: Zhao Wang Physics 5e ElegantBook PDF
on:
  push:
    branches: [main]
    paths:
      - 'external_sources/zhao-wang-physics-5e-elegant/**'
      - '.github/workflows/zhao-wang-physics-elegantbook.yml'
  workflow_dispatch:

concurrency:
  group: zhao-wang-physics-5e-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check referenced item count, block structure and numeric invariants
        run: python3 external_sources/zhao-wang-physics-5e-elegant/check_math.py
      - name: Reuse the existing Irodov ElegantBook class
        shell: bash
        run: |
          cp external_sources/irodov-zh-elegant/elegantbook.cls \
             external_sources/zhao-wang-physics-5e-elegant/elegantbook.cls
      - name: Compile Zhao Wang physics study edition (XeLaTeX)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: external_sources/zhao-wang-physics-5e-elegant
          root_file: |
            cover.tex
            main.tex
          texlive_version: '2026'
          args: -xelatex -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload compiled PDF for review
        uses: actions/upload-artifact@v4
        with:
          name: zhao-wang-physics-5e-elegantbook
          path: |
            external_sources/zhao-wang-physics-5e-elegant/main.pdf
            external_sources/zhao-wang-physics-5e-elegant/cover.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Publish successfully compiled PDF back to repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root=external_sources/zhao-wang-physics-5e-elegant
          cp "$root/main.pdf" "$RUNNER_TEMP/zhao-wang-main.pdf"
          cp "$root/cover.pdf" "$RUNNER_TEMP/zhao-wang-cover.pdf"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- "$root/main.tex" "$root/chapters"; then
              echo "Newer LaTeX exists; do not overwrite a newer PDF."
              exit 0
            fi
            git reset --hard FETCH_HEAD
            sudo rm -f "$root/main.pdf" "$root/cover.pdf"
            cp "$RUNNER_TEMP/zhao-wang-main.pdf" "$root/main.pdf"
            cp "$RUNNER_TEMP/zhao-wang-cover.pdf" "$root/cover.pdf"
            git add -f "$root/main.pdf" "$root/cover.pdf"
            if git diff --cached --quiet; then
              echo "PDF already current."
              exit 0
            fi
            git commit -m "docs: publish Zhao Wang physics ElegantBook PDF [skip ci]"
            if git push origin HEAD:main; then
              echo "Published compiled PDF."
              exit 0
            fi
            echo "Concurrent update, rechecking latest main."
          done
          exit 1
