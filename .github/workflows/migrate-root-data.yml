name: One-time consolidated data path migration
on:
  push:
    branches: [chore/physics-root-simplify-20261122]
    paths: ['.github/workflows/migrate-root-data.yml']
permissions:
  contents: write
concurrency:
  group: physics-root-data-migration
  cancel-in-progress: false
jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert migrated root folders and unchanged canonical source tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          have = {p.name for p in Path('.').iterdir() if p.is_dir() and p.name != '.git'}
          expected = {'.github','bank','data','docs','external_sources','scripts','tests','tex'}
          assert have == expected, (sorted(have),sorted(expected))
          for old in ('localization','localized','qa','taxonomy'):
              assert not Path(old).exists(), old
          print('Eight top-level functional directories verified')
          PY
      - name: Migrate all stored paths without altering unrelated content
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          
          ROOT = Path(".")
          tracked = [p.decode("utf-8") for p in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0") if p]
          SKIP = {
              "data/README.md",
              "data/localized/zh_CN/合订/README.md",
              ".github/workflows/migrate-root-data.yml",
          }
          EXTS = {".md", ".json", ".csv", ".py", ".tex", ".sh", ".ps1", ".yml", ".yaml", ".txt", ".jsonl"}
          rules = (
              (b"localization/zh_CN/", b"data/localization/zh_CN/"),
              (b"localized/zh_CN/", b"data/localized/zh_CN/"),
              (b"taxonomy/physics_taxonomy.json", b"data/taxonomy/physics_taxonomy.json"),
          )
          changed = {}
          for name in tracked:
              path = ROOT / name
              if (name in SKIP or name.startswith(("bank/", "tex/")) or name == "data/problems.json"
                      or path.suffix not in EXTS or not path.is_file()):
                  continue
              original = path.read_bytes()
              modified = original
              for old, new in rules:
                  modified = re.sub(rb"(?<!data/)" + re.escape(old), lambda _m, n=new: n, modified)
              modified = re.sub(rb"(?<!data/)qa/(?=(?:README\.md|ID\.json|[A-Z]\d{3,5}\.json))", b"data/qa/", modified)
              if modified != original:
                  path.write_bytes(modified)
                  changed[name] = len(modified) - len(original)
              for old, _ in rules:
                  if re.search(rb"(?<!data/)" + re.escape(old), modified):
                      raise RuntimeError("remaining stale root reference in " + name)
          expected = {"scripts/materialize_zh_drafts.py",
                      "scripts/organize_physics_catalog.py",
                      "scripts/export_zh_review.py",
                      "data/localized/zh_CN/中文译稿报告.json",
                      "tests/test_physics_organization.py"}
          if not expected.issubset(changed):
              raise RuntimeError("critical migration files not changed: " + str(sorted(expected - set(changed))))
          print("Updated references in", len(changed), "tracked text files")
          for name in sorted(changed):
              print("PATH-MIGRATED:", name, "byte delta:", changed[name])
          PY
      - name: Verify all seven original candidate archives and formal TeX source
        run: |
          python3 scripts/compact_external_candidates.py --verify
          python3 scripts/compact_small_external_sources.py --verify
          python3 scripts/compact_webwork_sources.py --verify
          python3 scripts/build.py --check
          python3 scripts/check_review.py
      - name: Restore only ignored review-input files for translation regression
        run: |
          python3 scripts/compact_external_candidates.py --restore physics_refresher
          python3 scripts/compact_external_candidates.py --restore college_physics
          python3 scripts/compact_small_external_sources.py --restore intro_physics
      - name: Rebuild and test bilingual reference maps against original source bytes
        run: |
          python3 -m unittest discover -s tests -p 'test_export_zh_review.py' -v
          python3 -m unittest discover -s tests -p 'test_physics_organization.py' -v
      - name: Enforce root-layout and relative-link consistency
        run: |
          python3 scripts/check_repository_layout.py
          git diff --exit-code -- bank/ tex/ external_sources/irodov-zh-elegant/
      - name: Commit only corrected references and generated data indices
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(bank/|tex/|external_sources/_bundles/|external_sources/irodov-zh-elegant/)'; then
            echo "Canonical source or archives unexpectedly staged"; exit 1
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'refactor(physics): rewrite references to four consolidated data directories'
            git push origin HEAD:chore/physics-root-simplify-20261122
          fi
          git status --short
