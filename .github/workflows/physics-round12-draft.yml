name: Physics Round 12 Draft QA and PDF (not admission)
on:
  push:
    branches: [physics-round12-50-work]
    paths: ['bank/**', 'data/**', 'tex/**', 'scripts/**', '.github/workflows/physics-round12-draft.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install symbolic verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Advanced-only admission structure (draft inventory only)
        run: python scripts/check_difficulty_gate.py
      - name: Full-bank editorial similarity checks
        run: python scripts/quality_gate_bulk.py
      - name: Re-run 200 legacy round-11 subpart checks on growing bank
        run: python scripts/check_round11_physics.py
      - name: Execute 44 independent draft subpart checks
        run: python scripts/check_round12_draft.py
      - name: Confirm draft QA report is reproducible
        run: git diff --exit-code -- data/round12_draft_validation_report.json
      - name: Verify synchronized canonical TeX and CSV
        run: python scripts/build.py --check
      - name: Compile draft question and solution PDF previews
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            questions.tex
            solutions.tex
          working_directory: tex
          latexmk_use_xelatex: true
      - name: Upload preview PDF artifacts (not release)
        uses: actions/upload-artifact@v4
        with:
          name: round12-draft-preview-pdfs
          path: |
            tex/questions.pdf
            tex/solutions.pdf
          if-no-files-found: error
