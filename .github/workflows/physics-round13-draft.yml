name: Physics Round 13 Draft QA and PDF (not admission)
on:
  push:
    branches: [physics-round13-50-work]
    paths: ['bank/**','data/**','tex/**','scripts/**','.github/workflows/physics-round13-draft.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Enforce metadata and advanced difficulty policy
        run: python scripts/check_difficulty_gate.py
      - name: Full-bank editorial similarity spotchecks
        run: python scripts/quality_gate_bulk.py
      - name: Recheck previous round 12 two hundred subparts
        run: python scripts/check_round12_physics.py
      - name: Execute round 13 draft multi-method checks
        run: python scripts/check_round13_draft.py
      - name: Execute next six round-13 model checks
        run: python scripts/check_round13_next6.py
      - name: Verify second round-13 QA report determinism
        run: git diff --exit-code -- data/round13_next6_validation_report.json
      - name: Execute third six high difficulty round 13 physical subpart checks
        run: python scripts/check_round13_third6.py
      - name: Verify third six validation report is deterministic
        run: git diff --exit-code -- data/round13_third6_validation_report.json
      - name: Verify machine report is reproducible
        run: git diff --exit-code -- data/round13_draft_validation_report.json
      - name: Verify synchronized canonical TeX and CSV
        run: python scripts/build.py --check
      - name: Compile both draft XeLaTeX PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            questions.tex
            solutions.tex
          working_directory: tex
          latexmk_use_xelatex: true
      - name: Upload PDF previews not for release
        uses: actions/upload-artifact@v4
        with:
          name: physics-round13-draft-preview-pdfs
          path: |
            tex/questions.pdf
            tex/solutions.pdf
          if-no-files-found: error
