name: Round 22 forty-problem draft source physics and PDF QA
on:
  push:
    branches: [physics-round22-40-work-20261030]
  workflow_dispatch:
jobs:
  source-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 40 distinct source triples and 160 four-part solutions
        run: node scripts/check_round22_40_draft.js > round22-source-report.json
      - name: Check 40 against repository history and 12 repaired repeated cores
        run: node scripts/check_round22_semantic_dedup.js > round22-semantic-report.json
      - name: Execute 160 independently formulated numerical and analytic regression assertions
        run: node scripts/check_round22_40_models.js > round22-model-report.json
      - name: Validate draft manifest
        run: python3 -m json.tool data/rounds/round22-inprogress.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: round22-draft-qa-reports
          path: |
            round22-source-report.json
            round22-semantic-report.json
            round22-model-report.json
  draft-pdf:
    needs: source-and-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-fonts-recommended fonts-noto-cjk
      - name: Build two TeX draft books
        run: node scripts/build_round22_draft.js
      - name: Compile question and solution PDFs
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build/round22 build/round22/round22-questions.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build/round22 build/round22/round22-solutions.tex
      - uses: actions/upload-artifact@v4
        with:
          name: round22-draft-two-pdfs
          path: |
            build/round22/round22-questions.pdf
            build/round22/round22-solutions.pdf
