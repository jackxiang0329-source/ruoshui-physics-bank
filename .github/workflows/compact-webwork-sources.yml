name: Physics third-stage lossless PG compaction
on:
  push:
    branches: [chore/physics-layout-naming-20261122]
    paths:
      - .github/workflows/compact-webwork-sources.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: physics-webwork-compaction
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exactly 80 original source programs and frozen canonical source trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files 'external_sources/webwork_opl/raw/*.pg' | wc -l)" -eq 59
          test "$(git ls-files 'external_sources/webwork_thermal/raw/*.pg' | wc -l)" -eq 21
          echo "bank_tree_before=$(git rev-parse HEAD:bank)" >> "$GITHUB_ENV"
          echo "irodov_tree_before=$(git rev-parse HEAD:external_sources/irodov-zh-elegant)" >> "$GITHUB_ENV"
          echo "opl_index_sha_before=$(git hash-object external_sources/webwork_opl/index.json)" >> "$GITHUB_ENV"
          echo "thermal_index_sha_before=$(git hash-object external_sources/webwork_thermal/index.json)" >> "$GITHUB_ENV"
      - name: Pack 80 PG programs losslessly and verify before deleting originals
        run: python3 scripts/compact_webwork_sources.py --apply
      - name: Independently verify three stages of archives
        run: |
          python3 scripts/compact_webwork_sources.py --verify
          python3 scripts/compact_small_external_sources.py --verify
          python3 scripts/compact_external_candidates.py --verify
      - name: Validate typed file names, 452 problem sources and every navigational link
        run: python3 scripts/check_repository_layout.py
      - name: Verify formal bank, Irodov and WeBWorK indices unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:bank)" = "$bank_tree_before"
          test "$(git rev-parse HEAD:external_sources/irodov-zh-elegant)" = "$irodov_tree_before"
          test "$(git hash-object external_sources/webwork_opl/index.json)" = "$opl_index_sha_before"
          test "$(git hash-object external_sources/webwork_thermal/index.json)" = "$thermal_index_sha_before"
          test -z "$(git status --porcelain -- bank/ tex/ data/ external_sources/irodov-zh-elegant/)"
          python3 scripts/build.py --check
      - name: Commit only verified PG removals and three new archive assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- external_sources/webwork_opl/raw external_sources/webwork_thermal/raw external_sources/_bundles
          deleted="$(git diff --cached --name-only --diff-filter=D | wc -l)"
          added="$(git diff --cached --name-only --diff-filter=A | wc -l)"
          test "$deleted" -eq 80
          test "$added" -eq 3
          if git diff --cached --name-only | grep -vE '^external_sources/(webwork_opl/raw/|webwork_thermal/raw/|_bundles/(webwork_opl-raw.tar.gz|webwork_thermal-raw.tar.gz|webwork_sources_manifest.json)$)'; then
            echo "Unexpected staged path"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(physics): archive 80 WeBWorK PG candidates byte-for-byte"
          git push origin HEAD:chore/physics-layout-naming-20261122
          echo "### 80 PG programs losslessly archived" >> "$GITHUB_STEP_SUMMARY"
          echo "3 new archive assets; -80 original raw files; canonical bank, Irodov and WeBWorK indices unchanged." >> "$GITHUB_STEP_SUMMARY"
