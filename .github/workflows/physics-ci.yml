name: Physics Advanced-only QA and PDF
on:
  push:
    branches: [main]
    paths: ['bank/**','tex/**','scripts/build.py','scripts/check_difficulty_gate.py','data/problems.json','.github/workflows/physics-ci.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce advanced-only admission
        run: python scripts/check_difficulty_gate.py
      - name: Validate TeX fragments and derived documents
        run: python scripts/build.py --check
      - name: Compile question and solution PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            questions.tex
            solutions.tex
          working_directory: tex
          latexmk_use_xelatex: true
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: advanced-physics-pdf
          path: |
            tex/questions.pdf
            tex/solutions.pdf
          if-no-files-found: error
