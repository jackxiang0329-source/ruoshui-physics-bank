name: Physics Advanced-only QA and PDF
on:
  push:
    branches: [main]
    paths: ['bank/**','tex/**','scripts/**','data/**','.github/workflows/physics-ci.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install symbolic verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Enforce advanced-only admission
        run: python scripts/check_difficulty_gate.py
      - name: Perform independent formula and numerical spotchecks
        run: python scripts/check_physics.py
      - name: Independently verify second-batch composite derivations
        run: python scripts/check_composite_expansion.py
      - name: Independent checks of 12-item bulk expansion
        run: python scripts/check_bulk_composite.py
      - name: Editorial near-duplicate and full-bank bulk gate
        run: python scripts/quality_gate_bulk.py
      - name: Cross-check fourth batch analytic identities
        run: python scripts/check_batch_04_physics.py
      - name: Check round 05 physical identities
        run: python scripts/check_round05_physics.py
      - name: Independently check round 06 physical invariants
        run: python scripts/check_round06_physics.py
      - name: Verify seventh batch physical formulas
        run: python scripts/check_round07_physics.py
      - name: Fifty new problems independently checked
        run: python scripts/check_round08_physics.py
      - name: Independently check round 10 formula identities
        run: python scripts/check_round10_physics.py
      - name: Block historically repeated core physics models before release
        run: python scripts/check_round13_originality_gate.py
      - name: Enforce complete 50-problem future rounds and executed subpart QA
        run: python scripts/check_future_rounds.py
      - name: Validate TeX fragments and derived documents
        run: python scripts/build.py --check
      - name: Upload independent spotcheck report
        uses: actions/upload-artifact@v4
        with:
          name: advanced-physics-spotchecks
          path: |
            data/validation_report.json
            data/round06_validation_report.json
            data/round07_validation_report.json
            data/round08_validation_report.json
            data/round10_validation_report.json
            data/round11_validation_report.json
          if-no-files-found: error
      - name: Compile question and solution PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            questions.tex
            solutions.tex
          working_directory: tex
          latexmk_use_xelatex: true
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: advanced-physics-pdf
          path: |
            tex/questions.pdf
            tex/solutions.pdf
          if-no-files-found: error
