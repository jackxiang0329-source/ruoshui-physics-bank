name: Physics Bank Validation and PDF Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python QA dependencies
        run: python -m pip install -r requirements.txt
      - name: Check physics formula consistency
        run: python scripts/check_physics.py
      - name: Validate and generate TeX
        run: python scripts/build.py
      - name: Compile XeLaTeX documents
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            questions.tex
            solutions.tex
          working_directory: tex
          latexmk_use_xelatex: true
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ruoshui-physics-pdfs
          if-no-files-found: error
          path: |
            tex/questions.pdf
            tex/solutions.pdf
