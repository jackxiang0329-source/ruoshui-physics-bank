name: Round 15 replacement subset QA
on:
  push:
    branches: [physics-round15-50-work]
  workflow_dispatch:
jobs:
  subset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initial two cores (8 checks)
        run: node scripts/check_round15_replacements.js > /tmp/round15_1.json
      - name: First six cores (24 checks)
        run: node scripts/check_round15_six_models.js > /tmp/round15_2.json
      - name: Second six cores (24 checks)
        run: node scripts/check_round15_next_six_models.js > /tmp/round15_3.json
      - name: Third six cores (24 checks)
        run: node scripts/check_round15_third_six_models.js > /tmp/round15_4.json
      - name: Fourth six cores (24 checks)
        run: node scripts/check_round15_fourth_six_models.js > /tmp/round15_5.json
      - name: Fifth six cores (24 checks)
        run: node scripts/check_round15_fifth_six_models.js > /tmp/round15_6.json
      - name: Preserve global release block
        run: echo '128 of 200 subpart tests only, 9 historical physical core duplicates remain, mirrors/PDFs and expert review missing. Do not merge.'
