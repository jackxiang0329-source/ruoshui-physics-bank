name: Round 15 replacement subset QA
on:
  push:
    branches: [physics-round15-50-work]
  workflow_dispatch:
jobs:
  subset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify previous two replacements with 8 checks
        run: node scripts/check_round15_replacements.js > /tmp/round15_prior.json
      - name: Verify six new replacements with 24 checks
        run: node scripts/check_round15_six_models.js > /tmp/round15_six.json
      - name: Preserve blocked full-round gate
        run: echo 'Subset 32/200 only. 33 historical core-model blockers remain, mirrors and PDFs unverified.'
