name: Round 15 replacement subset QA
on:
  push:
    branches: [physics-round15-50-work]
  workflow_dispatch:
jobs:
  subset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: First two replacement models, 8 checks
        run: node scripts/check_round15_replacements.js > /tmp/round15_a.json
      - name: Next six replacement models, 24 checks
        run: node scripts/check_round15_six_models.js > /tmp/round15_b.json
      - name: Six further replacement models, 24 checks
        run: node scripts/check_round15_next_six_models.js > /tmp/round15_c.json
      - name: Release gate remains blocked
        run: echo '56 of 200 subset checks only, 27 historical core conflicts still need replacement. Mirrors and two PDFs NOT verified.'
