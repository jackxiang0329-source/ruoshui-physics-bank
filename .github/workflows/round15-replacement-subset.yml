name: Round 15 replacement subset QA
on:
  push:
    branches: [physics-round15-50-work]
  workflow_dispatch:
jobs:
  subset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initial pair replacements (8)
        run: node scripts/check_round15_replacements.js > /tmp/round15_1.json
      - name: First six replacements (24)
        run: node scripts/check_round15_six_models.js > /tmp/round15_2.json
      - name: Second six replacements (24)
        run: node scripts/check_round15_next_six_models.js > /tmp/round15_3.json
      - name: Third six replacements (24)
        run: node scripts/check_round15_third_six_models.js > /tmp/round15_4.json
      - name: Preserve incomplete full-round release gate
        run: echo '80/200 subpart checks; 21 remaining historical core collisions, unsynced mirrors and both PDFs. No merge.'
