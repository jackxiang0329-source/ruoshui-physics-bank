name: Round 21 forty-problem 160-subpart draft QA and PDF
on:
  push:
    branches: [physics-round21-40-draft-20261030]
  workflow_dispatch:
jobs:
  source-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 40 source triples and 160 solved subparts
        run: node scripts/check_round21_40_draft.js > round21-source-report.json
      - name: Execute 160 actual independent analytic and numeric subpart regression checks
        run: node scripts/check_round21_40_models.js > round21-model-report.json
      - name: Check round manifest
        run: python3 -m json.tool data/rounds/round21-inprogress.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: round21-draft-source-model-qa
          path: |
            round21-source-report.json
            round21-model-report.json
  draft-pdf:
    needs: source-and-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-fonts-recommended fonts-noto-cjk
      - name: Generate draft books
        run: node scripts/build_round21_draft.js
      - name: Compile questions and solutions
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build/round21 build/round21/round21-questions.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build/round21 build/round21/round21-solutions.tex
      - uses: actions/upload-artifact@v4
        with:
          name: round21-draft-two-pdfs
          path: |
            build/round21/round21-questions.pdf
            build/round21/round21-solutions.pdf
