name: Auto-import university physics OER

on:
  schedule:
    # Every 30 minutes, offset from minute 0 to reduce GitHub scheduler congestion (UTC).
    # Public-repo runner verification: trigger also on workflow edits.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-import-oer.yml'
      - 'scripts/auto_import_oer.py'
      - 'tests/test_auto_import_oer.py'
      - 'scripts/import_intro_physics.py'
      - 'tests/test_import_intro_physics.py'
      - 'scripts/discover_oer_sources.py'
      - 'scripts/import_hf_physics.py'
      - 'scripts/discover_hf_physics.py'
      - 'tests/test_import_hf_physics.py'
      - 'scripts/import_seephys.py'
      - 'tests/test_import_seephys.py'
      - 'scripts/import_college_physics.py'
      - 'tests/test_import_college_physics.py'
      - 'scripts/report_external_coverage.py'
      - 'tests/test_report_external_coverage.py'
      - 'scripts/reclassify_external_topics.py'
      - 'tests/test_reclassify_external_topics.py'
      - 'scripts/build.py'
      - 'scripts/curation_triage.py'
      - 'tests/test_curation_triage.py'
      - 'scripts/review_preflight.py'
      - 'tests/test_review_preflight.py'
      - 'scripts/college_tex_draft.py'
      - 'tests/test_college_tex_draft.py'

permissions:
  contents: write

concurrency:
  group: physics-oer-import-main
  cancel-in-progress: false

jobs:
  collect-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test safe import and license filters
        run: python -m unittest discover -s tests -p 'test_auto_import_oer.py' -v
      - name: Test independent university-physics source extractor
        run: python -m unittest discover -s tests -p 'test_import_intro_physics.py' -v
      - name: Unit-test Hugging Face ingestion, cursor and copyright guardrails
        run: python -m unittest discover -s tests -p 'test_import_hf_physics.py' -v
      - name: Unit-test SeePhys text-only importer and provenance rules
        run: python -m unittest discover -s tests -p 'test_import_seephys.py' -v
      - name: Test CC BY College Physics source parser and figure exclusion
        run: python -m unittest discover -s tests -p 'test_import_college_physics.py' -v
      - name: Test source coverage and strict exam eligibility gate
        run: python -m unittest discover -s tests -p 'test_report_external_coverage.py' -v
      - name: Test cross-source topic reclassification
        run: python -m unittest discover -s tests -p 'test_reclassify_external_topics.py' -v
      - name: Test editorial review priority and duplicate-digest reporting
        run: python -m unittest discover -s tests -p 'test_curation_triage.py' -v
      - name: Unit-test static source risk and near-text duplicate checks
        run: python -m unittest discover -s tests -p 'test_review_preflight.py' -v
      - name: Test partial MathML-to-TeX preview and conversion warnings
        run: python -m unittest discover -s tests -p 'test_college_tex_draft.py' -v
      - name: Fetch, verify, deduplicate and classify candidates
        run: python scripts/auto_import_oer.py --execute --limit 100 --scan-limit 500 --timeout 12
      - name: Fetch and extract CC BY physics examples from new upstream source
        run: python scripts/import_intro_physics.py --limit 100 --timeout 15
      - name: Discover new public university-physics source repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_oer_sources.py
      - name: Search Hugging Face for physics datasets (metadata only)
        run: python scripts/discover_hf_physics.py
      - name: Import synthetic Hugging Face physics questions into unverified staging
        continue-on-error: true
        run: python scripts/import_hf_physics.py --limit 500 --scan-limit 1000 --timeout 20
      - name: Import only standalone SeePhys text questions (media excluded)
        continue-on-error: true
        run: python scripts/import_seephys.py --limit 100 --scan-limit 250 --timeout 20
      - name: Acquire CC BY College Physics course exercises from pinned GitHub source
        continue-on-error: true
        run: python scripts/import_college_physics.py --limit 500 --max-files 50 --timeout 15
      - name: Reclassify previously imported Hugging Face and College Physics candidates
        run: python scripts/reclassify_external_topics.py
      - name: Rebuild exam-review candidate list (not the approved question bank)
        run: python scripts/rebuild_external_queue.py
      - name: Audit imported raw files
        run: python scripts/external_inventory.py
      - name: Verify queue matches every imported raw problem and pinned manifests
        run: python -m unittest discover -s tests -p 'test_external_sources.py' -v
      - name: Summarize source, subject and exam-readiness coverage
        run: python scripts/report_external_coverage.py
      - name: Generate human-review shortlist and cross-source digest audit
        run: python scripts/curation_triage.py
      - name: Inspect editorial shortlist for MathML, missing diagrams and answer leaks
        run: python scripts/review_preflight.py
      - name: Produce an editor-only OpenStax TeX draft with explicit unsupported-formula markers
        run: python scripts/college_tex_draft.py
      - name: Regenerate independent bank masters and verify consistent index
        run: |
          python scripts/build.py
          python scripts/build.py --check
      - name: Commit imported sources, manifests and per-run logs
        run: |
          git add external_sources/ tex/questions.tex tex/solutions.tex data/index.csv data/qa_report.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(oer): automated 30-minute physics candidate import"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload importer report, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oer-import-report
          path: |
            external_sources/logs/latest.json
            external_sources/logs/intro_physics_latest.json
            external_sources/logs/huggingface_import_latest.json
            external_sources/logs/seephys_import_latest.json
            external_sources/logs/college_physics_latest.json
            external_sources/logs/topic_backfill_latest.json
            external_sources/catalog/review_triage_report.json
            external_sources/catalog/review_priority.csv
            external_sources/catalog/review_preflight_report.json
            external_sources/catalog/review_preflight.csv
            external_sources/catalog/college_review_tex_report.json
            external_sources/catalog/college_review_tex_draft.tex
            external_sources/catalog/college_review_preview.tex
          if-no-files-found: warn
          retention-days: 30

  editorial-pdf-preview:
    needs: collect-verify-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout committed editor-only preview sources
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Compile OpenStax 60-question editorial preview with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: college_review_preview.tex
          working_directory: external_sources/catalog
          latexmk_use_xelatex: true
      - name: Publish draft PDF as a CI artifact, never as an approved bank
        uses: actions/upload-artifact@v4
        with:
          name: college-physics-editorial-preview-pdf
          if-no-files-found: error
          retention-days: 30
          path: external_sources/catalog/college_review_preview.pdf
