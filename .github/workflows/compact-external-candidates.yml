name: One-time lossless external candidate compaction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-external-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-external-candidate-compaction
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check initial source-file count and immutable formal bank
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files 'external_sources/hf_physics_dpo/raw/*.md' | wc -l)" -eq 16611
          test "$(git ls-files 'external_sources/college_physics/raw/*.md' | wc -l)" -eq 2526
          test "$(git ls-files 'external_sources/physics_refresher/raw/*.md' | wc -l)" -eq 700
          echo "baseline_head=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "bank_sha_before=$(git ls-tree HEAD bank | awk '{print $3}')" >> "$GITHUB_ENV"
          echo "irodov_sha_before=$(git ls-tree HEAD external_sources/irodov-zh-elegant | awk '{print $3}')" >> "$GITHUB_ENV"
      - name: Bundle 19,837 noncanonical raw Markdown candidates with byte-perfect roundtrip checks
        run: python3 scripts/compact_external_candidates.py --apply
      - name: Independently verify all archive members and source indices after deletion
        run: python3 scripts/compact_external_candidates.py --verify
      - name: Ensure canonical advanced physics bank and Irodov are unaffected
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build.py --check
          test "$(git ls-tree HEAD bank | awk '{print $3}')" = "$bank_sha_before"
          test "$(git ls-tree HEAD external_sources/irodov-zh-elegant | awk '{print $3}')" = "$irodov_sha_before"
      - name: Commit exactly the external raw removals and verified compressed bundles
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- external_sources/hf_physics_dpo external_sources/college_physics external_sources/physics_refresher external_sources/_bundles
          deleted="$(git diff --cached --name-only --diff-filter=D | wc -l)"
          added="$(git diff --cached --name-only --diff-filter=A | wc -l)"
          echo "Deleted raw candidates from active tree: $deleted"
          echo "Added bundle and manifest objects: $added"
          test "$deleted" -eq 19837
          test "$added" -eq 4
          if git diff --cached --name-only | grep -vE '^external_sources/(hf_physics_dpo/raw/|college_physics/raw/|physics_refresher/raw/|_bundles/)'; then
            echo "Unexpected changed path; aborting"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(physics): archive 19837 unreviewed source candidates losslessly [skip ci]"
          # Standard fast-forward push only. A concurrent write to main
          # must cause a safe failure, not a forced history rewrite.
          git push origin HEAD:main
          echo "### 大学物理仓库无损瘦身" >> "$GITHUB_STEP_SUMMARY"
          echo "主分支减少 19,837 个未审核 Markdown，增加 3 个无损归档和 1 个 SHA-256 清单。" >> "$GITHUB_STEP_SUMMARY"
          echo "正式 452 题主库和 Irodov ElegantBook 未改变。历史单题文件可从归档或备份分支恢复。" >> "$GITHUB_STEP_SUMMARY"
